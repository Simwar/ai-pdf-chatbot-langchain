# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: ai-pdf-chatbot-langchain

meta:
  description: "AI PDF chatbot with LangChain & LangGraph for document Q&A"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: false

models:
  openai:
    provider: openai

integrations:
  openai:
    provider: openai

knowledge:
  db:
    provider: postgres
    persistent: true

dev:
  interfaces:
    frontend:
      port: 3000

