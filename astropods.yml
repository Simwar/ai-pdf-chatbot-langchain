# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: ai-pdf-chatbot-langchain

meta:
  description: "AI PDF chatbot with LangChain & LangGraph for document Q&A"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: false

models:
  openai:
    provider: openai

integrations:
  openai:
    provider: openai

knowledge:
  db:
    container:
      image: pgvector/pgvector:pg17
      port: 5432
      volume: /var/lib/postgresql/data
    persistent: true
    inputs:
      - name: POSTGRES_DB
        datatype: string
        default: postgres
      - name: POSTGRES_USER
        datatype: string
        default: postgres
      - name: POSTGRES_PASSWORD
        datatype: string
        secret: true
        default: postgres

dev:
  interfaces:
    frontend:
      port: 3000

