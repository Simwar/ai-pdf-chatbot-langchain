# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: astro/v1
name: pdf-agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: false

models:
  openai:
    provider: openai

knowledge:
  db:
    provider: postgres
    persistent: true

dev:
  interfaces:
    frontend:
      port: 80
